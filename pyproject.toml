[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescue-pricing-solver"
version = "0.1.0"
description = "Finite-type strategic rescue-pricing solver with independent numerical audits"
requires-python = ">=3.10"
dependencies = ["numpy>=1.25,<3"]

[project.scripts]
rescue-solver = "rescue_solver.cli:main"

[tool.setuptools.packages.find]
include = ["rescue_solver*", "research_solver*"]
